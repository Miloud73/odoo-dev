
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: Azeqsdwxc1123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: host.docker.internal
      PORT: 5432
      USER: odoo
      PASSWORD: Azeqsdwxc1123
    volumes:
      - ./addons:/mnt/extra-addons

volumes:
  db_data:
